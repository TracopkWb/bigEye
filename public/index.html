<!doctype html>
<html>
  <head>
    <title>bigEye RTSP Live Stream</title>
    <style>
      body {
        background: #121212;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
        margin-top: 40px;
      }
      video {
        width: 90%;
        max-width: 960px;
        background: #000;
        border: 1px solid #444;
        border-radius: 8px;
      }
      #status {
        margin-top: 15px;
        color: #00ffcc;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>bigEye RTSP Live Stream</h2>
    <video id="remoteVideo" autoplay playsinline muted controls></video>
    <div id="status">Connecting to WebSocket...</div>

    <script>
      const status = document.getElementById("status");
      const video = document.getElementById("remoteVideo");
      const ws = new WebSocket(`ws://${location.host}/ws`);
      let pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      pc.ontrack = (event) => {
        console.log("[WebRTC] Received remote track:", event.track.kind);
        const video = document.getElementById("remoteVideo");
        if (video) {
          video.srcObject = event.streams[0] || new MediaStream([event.track]);
          video.play().catch((e) => console.error("Playback failed:", e));
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({ type: "candidate", candidate: event.candidate }),
          );
        }
      };

      ws.onopen = async () => {
        status.innerText = "WebSocket Connected. Initiating WebRTC...";
        pc.addTransceiver("video", { direction: "recvonly" });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "offer", sdp: offer.sdp }));
      };

      ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);
        if (data.type === "answer") {
          await pc.setRemoteDescription(new RTCSessionDescription(data));
          status.innerText = "WebRTC Connected. Waiting for video frames...";
        } else if (data.type === "candidate" && data.candidate) {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      };
    </script>
  </body>
</html>
