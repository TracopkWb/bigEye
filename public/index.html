<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BigEye WebRTC Stream</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;

        margin: 0;
        padding: 20px;

        text-align: center;
      }

      h1 {
        margin-top: 0;
      }

      #remoteVideo {
        width: 90%;
        max-width: 1280px;

        background: #000;

        border: 2px solid #333;
        border-radius: 8px;

        display: block;
        margin: 20px auto;
      }

      #status {
        margin-top: 15px;

        font-weight: bold;

        padding: 10px;

        border-radius: 5px;

        background: #222;
      }

      #log {
        width: 90%;
        max-width: 1280px;

        height: 250px;

        margin: 20px auto;

        padding: 10px;

        background: #000;

        border: 1px solid #333;
        border-radius: 5px;

        color: #0f0;

        font-family: monospace;
        font-size: 12px;

        text-align: left;

        overflow-y: auto;

        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <h1>BigEye WebRTC Stream</h1>

    <video id="remoteVideo" autoplay playsinline muted></video>

    <div id="status">Starting...</div>

    <div id="log"></div>

    <script>
      const video = document.getElementById("remoteVideo");

      const status = document.getElementById("status");

      const logElement = document.getElementById("log");

      /* =====================================================
       * LOGGING
       * ===================================================== */

      function log(message) {
        console.log(message);

        const time = new Date().toLocaleTimeString();

        logElement.textContent += `[${time}] ${message}\n`;

        logElement.scrollTop = logElement.scrollHeight;
      }

      function setStatus(message) {
        status.innerText = message;

        log(message);
      }

      /* =====================================================
       * PEER CONNECTION
       * ===================================================== */

      const pc = new RTCPeerConnection({
        iceServers: [
          {
            urls: "stun:stun.l.google.com:19302",
          },
        ],
      });

      /* =====================================================
       * WEBSOCKET
       * ===================================================== */

      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";

      const wsUrl = `${wsProtocol}//${window.location.hostname}:8080/ws`;

      log(`Connecting WebSocket: ${wsUrl}`);

      const ws = new WebSocket(wsUrl);

      /* =====================================================
       * REMOTE TRACK
       * ===================================================== */

      pc.ontrack = (event) => {
        log("Received remote WebRTC track");

        log(`Track kind: ${event.track.kind}`);

        if (event.streams.length > 0) {
          video.srcObject = event.streams[0];

          setStatus("Stream received");

          video
            .play()
            .then(() => {
              log("Video playback started");
            })
            .catch((error) => {
              log("Video play() failed: " + error);
            });
        }
      };

      /* =====================================================
       * LOCAL ICE
       * ===================================================== */

      pc.onicecandidate = (event) => {
        if (!event.candidate) {
          log("ICE gathering complete");

          return;
        }

        const candidate = {
          candidate: event.candidate.candidate,

          sdpMLineIndex: event.candidate.sdpMLineIndex,

          sdpMid: event.candidate.sdpMid,
        };

        log("Browser -> Server ICE candidate");

        if (ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              ice: candidate,
            }),
          );
        }
      };

      /* =====================================================
       * CONNECTION STATE
       * ===================================================== */

      pc.onconnectionstatechange = () => {
        log("WebRTC connectionState: " + pc.connectionState);

        if (pc.connectionState === "connected") {
          setStatus("WebRTC Connected");
        } else if (pc.connectionState === "failed") {
          setStatus("WebRTC Connection Failed");
        } else if (pc.connectionState === "disconnected") {
          setStatus("WebRTC Disconnected");
        }
      };

      /* =====================================================
       * ICE CONNECTION STATE
       * ===================================================== */

      pc.oniceconnectionstatechange = () => {
        log("ICE connectionState: " + pc.iceConnectionState);
      };

      /* =====================================================
       * ICE GATHERING STATE
       * ===================================================== */

      pc.onicegatheringstatechange = () => {
        log("ICE gatheringState: " + pc.iceGatheringState);
      };

      /* =====================================================
       * SIGNALING STATE
       * ===================================================== */

      pc.onsignalingstatechange = () => {
        log("Signaling state: " + pc.signalingState);
      };

      /* =====================================================
       * WEBSOCKET OPEN
       * ===================================================== */

      ws.onopen = async () => {
        log("WebSocket connected");

        setStatus("WebSocket connected - negotiating...");

        /* -------------------------------------------------
         * Receive-only video transceiver
         * ------------------------------------------------- */

        log("Adding receive-only video transceiver");

        pc.addTransceiver("video", {
          direction: "recvonly",
        });

        try {
          /* ---------------------------------------------
           * Create SDP offer
           * --------------------------------------------- */

          log("Creating SDP offer...");

          const offer = await pc.createOffer();

          /* ---------------------------------------------
           * Set local description
           * --------------------------------------------- */

          await pc.setLocalDescription(offer);

          log("Local SDP description set");

          /* ---------------------------------------------
           * Send offer
           * --------------------------------------------- */

          if (ws.readyState !== WebSocket.OPEN) {
            log("WebSocket is not open");

            return;
          }

          ws.send(
            JSON.stringify({
              sdp: pc.localDescription,
            }),
          );

          log("SDP Offer sent to server");
        } catch (error) {
          console.error(error);

          setStatus("Error creating SDP offer");

          log("Offer error: " + error);
        }
      };

      /* =====================================================
       * WEBSOCKET MESSAGE
       * ===================================================== */

      ws.onmessage = async (event) => {
        log("Received signaling message");

        let msg;

        try {
          msg = JSON.parse(event.data);
        } catch (error) {
          log("Invalid JSON from server");

          return;
        }

        /* =================================================
         * SDP ANSWER
         * ================================================= */

        if (msg.sdp) {
          log("Received SDP Answer from server");

          try {
            await pc.setRemoteDescription(
              new RTCSessionDescription({
                type: msg.sdp.type,
                sdp: msg.sdp.sdp,
              }),
            );

            log("Remote SDP description set");

            setStatus("SDP negotiation completed");
          } catch (error) {
            console.error(error);

            log("Failed to set remote SDP: " + error);

            setStatus("Failed to set remote SDP");
          }

          return;
        }

        /* =================================================
         * ICE
         * ================================================= */

        if (msg.ice) {
          log("Received ICE candidate from server");

          try {
            await pc.addIceCandidate(
              new RTCIceCandidate({
                candidate: msg.ice.candidate,

                sdpMLineIndex: msg.ice.sdpMLineIndex,

                sdpMid: msg.ice.sdpMid,
              }),
            );

            log("Server ICE candidate added");
          } catch (error) {
            console.error(error);

            log("Failed to add server ICE: " + error);
          }

          return;
        }

        log("Unknown signaling message");
      };

      /* =====================================================
       * WEBSOCKET CLOSE
       * ===================================================== */

      ws.onclose = () => {
        log("WebSocket connection closed");

        setStatus("Signaling connection closed");
      };

      /* =====================================================
       * WEBSOCKET ERROR
       * ===================================================== */

      ws.onerror = (error) => {
        console.error("WebSocket error:", error);

        log("WebSocket error");

        setStatus("WebSocket error");
      };
    </script>
  </body>
</html>
