<!doctype html>
<html>
  <head>
    <title>BigEye WebRTC Stream</title>
    <style>
      body {
        background: #111;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
      }
      video {
        width: 80%;
        max-width: 1280px;
        background: #000;
        border: 2px solid #333;
        border-radius: 8px;
      }
      #status {
        margin-top: 10px;
        color: #0f0;
      }
    </style>
  </head>
  <body>
    <h2>Hikvision Live WebRTC Feed</h2>
    <video id="remoteVideo" autoplay playsinline controls muted></video>
    <div id="status">Connecting...</div>

    <script>
      const video = document.getElementById("remoteVideo");
      const status = document.getElementById("status");

      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      const ws = new WebSocket(`ws://${window.location.hostname}:8080/ws`);

      pc.ontrack = (event) => {
        if (video.srcObject !== event.streams[0]) {
          video.srcObject = event.streams[0];
          status.innerText = "Stream Connected!";
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ ice: event.candidate }));
        }
      };

      ws.onopen = async () => {
        status.innerText = "WebSocket Connected. Requesting Stream...";
        pc.addTransceiver("video", { direction: "recvonly" });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ sdp: offer }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        } else if (msg.ice) {
          await pc.addIceCandidate(new RTCIceCandidate(msg.ice));
        }
      };

      ws.onclose = () => {
        status.innerText = "Signaling Connection Closed.";
      };
    </script>
  </body>
</html>
