<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bigEye WebRTC Stream</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 960px;
        }
        video {
            width: 100%;
            background: #000000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #00e676;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>bigEye RTSP Live Stream</h2>
        <video id="remoteVideo" autoplay playsinline muted controls></video>
        <div id="status">Connecting to WebSocket...</div>
    </div>

    <script>
        const video = document.getElementById('remoteVideo');
        const status = document.getElementById('status');
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        let pc;

        ws.onopen = async () => {
            status.innerText = "WebSocket Connected. Setting up WebRTC...";

            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            // Receive incoming video stream
            pc.ontrack = (event) => {
                status.innerText = "Stream active!";
                if (video.srcObject !== event.streams[0]) {
                    video.srcObject = event.streams[0];
                }
            };

            // Send local browser ICE candidates to C server
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'candidate',
                        candidate: event.candidate
                    }));
                }
            };

            // Monitor connection health
            pc.oniceconnectionstatechange = () => {
                status.innerText = `ICE State: ${pc.iceConnectionState}`;
            };

            // Explicitly request video delivery
            pc.addTransceiver('video', { direction: 'recvonly' });

            // Create and send SDP Offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws.send(JSON.stringify({
                type: 'offer',
                sdp: offer.sdp
            }));
        };

        ws.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);

            if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: data.sdp
                }));
            } 
            else if (data.type === 'candidate' && data.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (err) {
                    console.error("Error adding remote ICE candidate:", err);
                }
            }
        };

        ws.onerror = (err) => {
            status.innerText = "WebSocket connection error.";
            console.error(err);
        };
    </script>
</body>
</html>
