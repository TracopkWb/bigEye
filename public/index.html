<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>bigEye RTSP WebRTC Stream</title>
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 30px;
      }
      video {
        width: 90%;
        max-width: 960px;
        height: auto;
        background: #000;
        border: 2px solid #333;
        border-radius: 8px;
      }
      #status {
        margin-top: 15px;
        font-weight: bold;
        color: #00e676;
      }
    </style>
  </head>
  <body>
    <h2>bigEye Live Stream</h2>
    <!-- Video element MUST contain muted, autoplay, and playsinline -->
    <video id="remoteVideo" autoplay playsinline muted controls></video>
    <div id="status">Connecting...</div>

    <script>
      const statusDiv = document.getElementById("status");
      const videoElem = document.getElementById("remoteVideo");

      const ws = new WebSocket(`ws://${window.location.host}/ws`);
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      // Listen for incoming media track from GStreamer
      pc.ontrack = (event) => {
        console.log("[WebRTC] Received remote track:", event.track.kind);
        statusDiv.innerText = "Stream Live";

        if (event.streams && event.streams[0]) {
          videoElem.srcObject = event.streams[0];
        } else {
          videoElem.srcObject = new MediaStream([event.track]);
        }

        videoElem.play().catch((err) => {
          console.warn("[WebRTC] Autoplay blocked, playing muted:", err);
          videoElem.muted = true;
          videoElem.play();
        });
      };

      // Send browser ICE candidates back to C server
      pc.onicecandidate = (event) => {
        if (event.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "candidate",
              candidate: event.candidate,
            }),
          );
        }
      };

      ws.onopen = async () => {
        statusDiv.innerText =
          "WebSocket Connected. Initiating WebRTC Handshake...";

        // Force WebRTC to expect incoming video
        pc.addTransceiver("video", { direction: "recvonly" });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        ws.send(
          JSON.stringify({
            type: "offer",
            sdp: offer.sdp,
          }),
        );
      };

      ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "answer") {
          console.log("[Signaling] SDP Answer received from server");
          await pc.setRemoteDescription(new RTCSessionDescription(data));
          statusDiv.innerText = "SDP Handshake Complete. Gathering ICE...";
        } else if (data.type === "candidate" && data.candidate) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            console.log("[ICE] Server candidate added successfully");
          } catch (e) {
            console.error("[ICE] Error adding candidate:", e);
          }
        }
      };

      ws.onclose = () => {
        statusDiv.innerText = "WebSocket Disconnected";
        statusDiv.style.color = "#ff5252";
      };
    </script>
  </body>
</html>
